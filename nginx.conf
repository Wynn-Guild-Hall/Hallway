# Serves the Hugo-built static site and reverse-proxies /api/* to Hall-Monitor
# over the hall-internal Docker network. Hall-Monitor is never exposed to
# Traefik directly — its only public surface is via nginx here.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static site.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Only the join lookup is public, and it's the only endpoint this site
    # calls. Everything else under /api/ falls through to the static
    # handler above and 404s — nginx matches the longest prefix, so this
    # block wins for /api/join/ and `location /` takes the rest.
    #
    # /api/verify in particular must NOT be reachable from a browser: its
    # entire security model is that joining verify.wynnvets.org in
    # Minecraft proves you own the account. Exposed over HTTP it becomes
    # "name a chief, get an invite as them", since a UUID is public
    # information derivable from any username.  Picolimbo reaches it
    # directly over the `verify` Docker network instead.
    #
    # HALL_MONITOR_UPSTREAM is passed through as an nginx variable at container
    # start via envsubst-style substitution in the compose file (or hard-coded
    # to the container name if envsubst isn't wired). Default matches the
    # docker-compose service name + port.
    location /api/join/ {
        proxy_pass http://hall-monitor:9423/api/join/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
